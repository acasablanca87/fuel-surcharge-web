name: Aggiornamento Automatico Dati MASE

on:
  schedule:
    # ⚡ 1. Scatto fulmineo: 11:52 ora italiana estiva (09:52 UTC) per intercettare l'aggiornamento rapido delle 11:50
    - cron: '52 9 * * 2'

    # 🎯 2. Finestra Calda Martedì (ogni 15 min): minuti :07, :22, :37, :52
    # Copre dalle 12:07 alle 14:40 in estate e dalle 11:07 alle 13:40 in inverno
    - cron: '7,22,37,52 10,11 * * 2'
    - cron: '7,22,37 12 * * 2'

    # 🕒 3. Monitoraggio pomeridiano (1 check all'ora su minuti sfasati fino alle 18:17 IT se il MASE ritarda)
    - cron: '17 13,14,15,16 * * 2'

    # 🛡️ 4. Safety Fallback: mercoledì mattina alle 09:17 IT (07:17 UTC) se martedì era festivo
    - cron: '17 7 * * 3'
  
  # Consente l'avvio manuale immediato con 1 click
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mase-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Scarica il repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: 🐍 Configura Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: ⚡ Esegui lo script di download MASE
        run: |
          python fetch_data.py

      - name: 💾 Salva i dati se modificati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Aggiunge il file all'area di staging se modificato
          git add src/data/gasolio_mase.json
          
          # Verifica in modo pulito se ci sono modifiche effettive
          if git diff --staged --quiet; then
            echo "ℹ️ Nessun nuovo dato ministeriale rilevato: database già allineato."
          else
            git commit -m "chore(data): aggiornamento automatico prezzi gasolio MASE"
            git pull --rebase origin main
            git push origin main
            echo "✅ Nuovi dati MASE registrati e inviati con successo!"
          fi
