name: Aggiornamento Automatico Dati MASE

on:
  schedule:
    # ⚡ 1. Anticipo flash pre-mezzogiorno: ore 11:57 (ora italiana reale)
    - cron: '57 11 * * 2'
      timezone: 'Europe/Rome'

    # 🎯 2. Finestra Clou Martedì (cadenza a minuti asimmetrici anti-congestione)
    # Ore 12:08, 12:21, 12:38, 12:54
    - cron: '8,21,38,54 12 * * 2'
      timezone: 'Europe/Rome'

    # Ore 13:14, 13:38, 13:56
    - cron: '14,38,56 13 * * 2'
      timezone: 'Europe/Rome'

    # Ore 14:24
    - cron: '24 14 * * 2'
      timezone: 'Europe/Rome'

    # 🕒 3. Monitoraggio pomeridiano di recupero (ore 16:18 e 18:18)
    - cron: '18 16,18 * * 2'
      timezone: 'Europe/Rome'

    # 🛡️ 4. Safety Fallback: mercoledì mattina alle 09:18 se martedì era festivo
    - cron: '18 9 * * 3'
      timezone: 'Europe/Rome'

  # Consente l'avvio manuale immediato con 1 click
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mase-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Scarica il repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: 🐍 Configura Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: ⚡ Esegui lo script di download MASE
        run: |
          python fetch_data.py

      - name: 💾 Salva i dati se modificati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Aggiunge il file all'area di staging se modificato
          git add src/data/gasolio_mase.json
          
          # Verifica in modo pulito se ci sono modifiche effettive
          if git diff --staged --quiet; then
            echo "ℹ️ Nessun nuovo dato ministeriale rilevato: database già allineato."
          else
            git commit -m "chore(data): aggiornamento automatico prezzi gasolio MASE"
            git pull --rebase origin main
            git push origin main
            echo "✅ Nuovi dati MASE registrati e inviati con successo!"
          fi
